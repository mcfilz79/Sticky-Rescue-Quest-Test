<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint');
const jumpSound=document.getElementById('sfxJump'),stickyLandingSound=document.getElementById('sfxStickyLanding'),shearsSound=document.getElementById('sfxShears');
const sallyShortSound=new Audio('https://mcfilz79.github.io/Sticky-Rescue-Quest-Test/sounds/audio/characters/sally_kurz.wav'),sallyMediumSound=new Audio('https://mcfilz79.github.io/Sticky-Rescue-Quest-Test/sounds/audio/characters/sally_mittel.wav'),sallyLongSound=new Audio('https://mcfilz79.github.io/Sticky-Rescue-Quest-Test/sounds/audio/characters/sally_lang.wav');
function playSound(sound){if(!sound)return;try{sound.pause();sound.currentTime=0;const playback=sound.play();if(playback&&playback.catch)playback.catch(()=>{});}catch(error){}}
function playJumpSound(){playSound(jumpSound)}
function playStickyLandingSound(){playSound(stickyLandingSound)}
function playShearsSound(){playSound(shearsSound)}
function playSallyVoice(lines){const length=lines.join(' ').length;playSound(length<=38?sallyShortSound:length<=58?sallyMediumSound:sallyLongSound)}
function sallyIntroLines(){return [['HALLO STICKY!','ICH BIN SALLY.'],['ICH KANN DIR','HINWEISE GEBEN.'],['WENN DU NICHT WEITERKOMMST,','HELFE ICH DIR.'],['MEINE TIPPS FINDEST DU','IM PAUSENMENUE WIEDER.'],sylvieHelp==='widePit'?['GROSSE LUECKEN:','A LAENGER GEDRUECKT HALTEN!']:sylvieHelp==='pit'?['SPRINGE MIT A UEBER DIE GRUBE!','HALTE RECHTS, BIS DU DRUEBEN BIST.']:sylvieHelp==='spikes'?['SPRINGE MIT A UEBER DIE DORNEN!','WARTE NICHT, BIS SIE DICH TREFFEN.']:['VERSUCHE ES MIT EINEM SPRUNG!','DU SCHAFFST DAS!']]}
function playSallyIntroPage(){const lines=sallyIntroLines()[introPage];if(lines)playSallyVoice(lines)}
function beginSallyIntro(){sylvieIntro=true;introPage=0;playSallyIntroPage()}
function playSallyHint(){playSallyVoice(['DU KENNST DIE FALLE DOCH SCHON!','ICH ERKLAERE ES NOCH EINMAL.',sylvieHelp==='widePit'?'GROSSE LUECKEN: A LAENGER HALTEN!':sylvieHelp==='pit'?'SPRINGE MIT A UEBER DIE GRUBE!':sylvieHelp==='spikes'?'SPRINGE MIT A UEBER DIE DORNEN!':'VERSUCHE ES MIT EINEM SPRUNG!'])}
ctx.imageSmoothingEnabled=false;
const G=['#0f380f','#306230','#8bac0f','#9bbc0f'];
const worldW=760,groundY=119;
const pits=[{x:150,w:25,kind:'small'},{x:470,w:34,kind:'wide'}];
let keys={},scene='title',paused=false,frame=0,cam=0,score=0,lives=5,hasShears=false,shearsUsed=false,landingSoundPending=false,pitSafeBySide=pits.map(()=>({left:null,right:null})),pitApproachIndex=-1,pitApproachSide='left',fallingPitKind='pit',fallingPitIndex=-1,fallingPitSide='left';
let sylvieMet=false,sylvieIntro=false,introPage=0,sylvieHelp='',sylvieShowHint=false,gameMessage='',messageTimer=0,jumpQueued=false,spikesActive=false,spikeHit=false,pendingSylvie=false,sylvieHint=false,gameoverChoice=0,fallingIntoPit=false,toolPickup=false,spikeKnockback=null;
let worldLostLives=0,trapFailures={pit:0,widePit:0,spikes:0,other:0},pauseScreen="main",pauseChoice=0,sallyTips=[],sallyTipScroll=0;
let player={x:18,y:95,vx:0,vy:0,w:9,h:12,on:false,face:1};
let cartridge={x:370,y:101,taken:false};
let bush={x:690,w:20,cleared:false};
function rect(a,b,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(a),Math.round(b),w,h)}
function txt(t,a,b,size=7,col=G[0],align='left'){ctx.fillStyle=col;ctx.font=`${size}px monospace`;ctx.textAlign=align;ctx.fillText(t,a,b)}
function tree(a,b,s=1){rect(a+3*s,b,3*s,18*s,G[1]);rect(a,b+4*s,9*s,8*s,G[0]);rect(a+2*s,b,7*s,8*s,G[1]);rect(a+4*s,b-4*s,5*s,7*s,G[2])}
function sticky(a,b){rect(a+2,b+2,6,8,G[1]);rect(a+1,b+4,8,5,G[1]);rect(a+2,b+1,6,3,G[2]);rect(a+3,b+3,1,2,G[0]);rect(a+6,b+3,1,2,G[0]);rect(a,b+5,2,3,G[1]);rect(a+9,b+5,2,3,G[1]);rect(a+2,b+10,2,2,G[0]);rect(a+7,b+10,2,2,G[0])}
function sylvie(a,b){ // simple placeholder helper sprite with ponytail and bow
  rect(a+3,b+3,7,7,G[1]);rect(a+4,b+1,5,3,G[2]);rect(a+4,b+5,1,1,G[0]);rect(a+8,b+5,1,1,G[0]);
  rect(a+2,b+2,2,6,G[0]);rect(a+9,b+1,2,5,G[0]);rect(a+11,b,2,2,G[1]);rect(a+1,b+8,2,2,G[1]);rect(a+10,b+8,2,2,G[1]);
}
function drawBG(offset=0){
  rect(0,0,160,144,G[3]);
  for(let i=0;i<7;i++){let xx=((i*43-offset*.18)%210+210)%210-25;tree(xx,67+(i%2)*8,1)}
  for(let i=0;i<4;i++){let xx=((i*72-offset*.3)%220+220)%220-35;rect(xx,91,42,9,G[2]);rect(xx+7,87,23,7,G[2])}
  // Draw solid ground only outside the pit spans: the gaps are genuinely open.
  let spans=[],start=0;for(const p of pits){if(p.x>start)spans.push([start,p.x]);start=p.x+p.w}if(start<worldW)spans.push([start,worldW]);
  for(const [a,b] of spans){let x1=a-offset,x2=b-offset;if(x2<=0||x1>=160)continue;rect(Math.max(0,x1),groundY,Math.min(160,x2)-Math.max(0,x1),25,G[1]);rect(Math.max(0,x1),groundY,Math.min(160,x2)-Math.max(0,x1),2,G[0]);}
  for(let i=0;i<25;i++){let xx=((i*17-offset)%170+170)%170;if(!pits.some(p=>xx+offset>=p.x&&xx+offset<p.x+p.w))rect(xx,groundY+5+(i%3)*4,3,1,G[2])}
}
function drawPit(pit){
  const sx=pit.x-cam;if(sx>160||sx+pit.w<0)return;
  // A true opening: no green floor is drawn here, only dark depth below the cut edges.
  rect(sx,groundY-1,pit.w,25,G[0]);
  rect(sx,groundY-3,2,4,G[0]);rect(sx+pit.w-2,groundY-3,2,4,G[0]);
  rect(sx+2,groundY+2,2,15,G[1]);rect(sx+pit.w-4,groundY+2,2,15,G[1]);
  rect(sx+4,groundY+8,pit.w-8,2,G[0]);
  for(let i=0;i<pit.w;i+=6){rect(sx+i,groundY-4,3,2,G[0]);}
  // Small stones are far below the surface, reinforcing that this is a drop, not a block.
  rect(sx+5,groundY+19,3,2,G[2]);rect(sx+pit.w-8,groundY+21,4,2,G[1]);
}


const PIXEL_FONT={
"0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111",
"4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010",
"8":"111101111101111","9":"111101111001111",
"A":"010101111101101","B":"110101110101110","C":"011100100100011","D":"110101101101110",
"E":"111100110100111","F":"111100110100100","G":"011100101101011","H":"101101111101101",
"I":"111010010010111","J":"001001001101010","K":"101101110101101","L":"100100100100111",
"M":"101111111101101","N":"101111111111101","O":"111101101101111","P":"110101110100100",
"Q":"111101101111001","R":"110101110101101","S":"011100010001110","T":"111010010010010",
"U":"101101101101111","V":"101101101101010","W":"101101111111101","X":"101101010101101",
"Y":"101101010010010","Z":"111001010100111","-":"000000111000000","+":"010010111010010"
};
function drawPixelText(value,centerX,y,color){
  const chars=String(value).toUpperCase();
  const width=chars.split("").reduce((sum,ch)=>sum+(ch===" "?2:4),-1);
  let x=Math.round(centerX-width/2);
  for(const ch of chars){
    if(ch===" "){x+=2;continue;}
    const glyph=PIXEL_FONT[ch];
    if(glyph){for(let row=0;row<5;row++)for(let col=0;col<3;col++)if(glyph[row*3+col]==="1")rect(x+col,y+row,1,1,color);}
    x+=4;
  }
}
function drawHud(){
  // 16-Pixel-HUD mit zusammenhängendem Waldrahmen und drei verbundenen Trennern.
  rect(0,0,160,16,G[3]);
  rect(0,0,160,1,G[1]);rect(0,1,160,1,G[2]);
  rect(0,14,160,1,G[2]);rect(0,15,160,1,G[1]);
  rect(50,0,1,16,G[1]);rect(69,0,1,16,G[1]);rect(128,0,1,16,G[1]);
  // Dezente Blattakzente direkt an den Trennern.
  rect(48,6,1,1,G[2]);rect(51,9,1,1,G[2]);
  rect(67,6,1,1,G[2]);rect(70,9,1,1,G[2]);
  rect(126,6,1,1,G[2]);rect(129,9,1,1,G[2]);
  // Bis zu fünf Cartridge-Symbole als Lebensanzeige.
  for(let i=0;i<Math.min(lives,5);i++){
    const x=2+i*8;
    rect(x+1,2,4,2,G[0]);rect(x,4,6,9,G[0]);
    rect(x+1,5,4,6,G[3]);rect(x+2,6,2,4,G[1]);
  }
  if(lives>5)drawPixelText("+"+(lives-5),42.5,5,G[0]);
  // Werkzeugfeld: Fragezeichen bis zur ersten Aufnahme, danach die Gartenschere.
  if(hasShears){
    rect(56,4,2,2,G[0]);rect(62,4,2,2,G[0]);
    rect(57,6,1,3,G[0]);rect(62,6,1,3,G[0]);
    rect(59,7,2,1,G[0]);rect(58,9,2,1,G[0]);rect(60,9,2,1,G[0]);
  }else{
    const q=["01110","10001","00010","00100","00000","00110"];
    q.forEach((line,row)=>{for(let col=0;col<5;col++)if(line[col]==="1")rect(58+col,4+row,1,1,G[2]);});
    // Der Punkt ist bewusst blattförmig statt ein gewöhnlicher Pixelpunkt.
    rect(60,10,2,1,G[2]);rect(59,11,1,1,G[2]);
  }
  // Eigene 3x5-Pixel-Schrift für Levelkennung und Punktestand.
  drawPixelText("W1L01 - WALD",98.75,5,G[0]);
  drawPixelText(String(score).padStart(6,"0"),144.25,5,G[0]);
}
function drawLevel(){
  drawBG(cam);
  pits.forEach(drawPit);
  let lx=95-cam;if(lx>-12&&lx<160){rect(lx,groundY-5,18,5,G[0]);rect(lx+2,groundY-4,14,2,G[2])}
  let tx=225-cam;if(tx>-20&&tx<160){rect(tx,98,24,3,G[0]);rect(tx+8,90,7,6,G[0]);rect(tx+9,91,5,4,G[2]);if(!hasShears)txt('✂',tx+11,88,7,G[0],'center')}
  let sx=330-cam;if(sx>-30&&sx<170){rect(sx,groundY-2,18,2,G[0]);if(spikesActive){for(let i=0;i<4;i++){rect(sx+i*5,groundY-7,3,5,G[0]);rect(sx+i*5+1,groundY-9,1,2,G[0])}}}
  if(!cartridge.taken){let q=cartridge.x-cam;if(q>-10&&q<170){rect(q,cartridge.y,6,7,G[0]);rect(q+1,cartridge.y+1,4,5,G[3]);rect(q+2,cartridge.y+2,2,2,G[1])}}
  // Bush is a solid, impassable barrier until cut with the shears.
  let bx=bush.x-cam;if(bx>-30&&bx<170&&!bush.cleared){rect(bx,groundY-10,20,10,G[1]);rect(bx+2,groundY-14,8,7,G[1]);rect(bx+9,groundY-16,8,9,G[0]);rect(bx+13,groundY-12,6,8,G[1]);rect(bx+5,groundY-12,2,2,G[2]);rect(bx+15,groundY-7,2,2,G[2]);
  }
  // Generic interaction hint only; the required tool is explained when collected.
  if(!bush.cleared&&nearBush()){rect(bx+3,groundY-29,14,10,G[0]);txt('B',bx+10,groundY-21,7,G[3],'center');}
  // Exit is deliberately hidden until both the shears obstacle and Sylvie's introduction are complete.
  if(bush.cleared&&sylvieMet){let ex=720-cam;if(ex>-20&&ex<170){rect(ex,groundY-22,14,22,G[0]);rect(ex+3,groundY-18,8,18,G[2]);txt('>',ex+7,groundY-8,7,G[0],'center')}}
  sticky(player.x-cam,player.y);
  drawHud();
  if(gameMessage&&messageTimer>0){
    rect(12,49,136,34,G[0]);rect(14,51,132,30,G[3]);
    if(toolPickup){
      // Pickup explanation pairs the shears with the obstacle types they clear.
      txt('GARTENSCHERE +15',80,61,6,G[0],'center');
      txt('RANKEN & GESTRUEPP',80,72,6,G[0],'center');
      rect(20,55,5,1,G[1]);rect(23,53,2,3,G[1]);rect(27,55,3,1,G[1]);rect(29,53,2,3,G[1]);
    }else{txt(gameMessage,80,64,6,G[0],'center');txt('A WEITER',80,76,5,G[1],'center')}
  }
  
  if(sylvieHint){rect(7,45,146,54,G[0]);rect(9,47,142,50,G[3]);sylvie(15,64);txt('DU KENNST DIE FALLE DOCH SCHON!',87,61,5,G[0],'center');txt('ICH ERKLAERE ES NOCH EINMAL.',87,70,5,G[0],'center');txt(sylvieHelp==='widePit'?'GROSSE LUECKEN: A LAENGER HALTEN!':sylvieHelp==='pit'?'SPRINGE MIT A UEBER DIE GRUBE!':sylvieHelp==='spikes'?'SPRINGE MIT A UEBER DIE DORNEN!':'VERSUCHE ES MIT EINEM SPRUNG!',87,80,5,G[0],'center');txt('A ODER B: WEITER',80,91,5,G[1],'center')}
  if(sylvieIntro){rect(7,45,146,55,G[0]);rect(9,47,142,51,G[3]);sylvie(16,61);const lines=sallyIntroLines();txt(lines[introPage][0],84,66,6,G[0],'center');txt(lines[introPage][1],84,77,6,G[0],'center');txt('A ODER B: WEITER',80,91,5,G[1],'center')}
  if(paused){rect(12,27,136,90,G[0]);rect(14,29,132,86,G[3]);if(pauseScreen==="main"){txt("PAUSE",80,41,9,G[0],"center");const opts=["WEITERSPIELEN","STEUERUNG"];if(sylvieMet)opts.push("SALLYS TIPPS");opts.forEach((v,i)=>{if(i===pauseChoice)rect(25,47+i*17,110,13,G[1]);txt((i===pauseChoice?"> ":"  ")+v,80,56+i*17,7,i===pauseChoice?G[3]:G[0],"center")});txt("PFEILE + A: AUSWAHL",80,105,5,G[1],"center")}else if(pauseScreen==="controls"){txt("STEUERUNG",80,43,8,G[0],"center");txt("PFEILE: BEWEGEN",80,59,6,G[0],"center");txt("A: SPRINGEN",80,71,6,G[0],"center");txt("B: WERKZEUG BENUTZEN",80,83,6,G[0],"center");txt("START: PAUSE",80,95,6,G[0],"center");txt("B: ZURUECK",80,107,5,G[1],"center")}else{txt("SALLYS TIPPS",80,43,8,G[0],"center");if(!sallyTips.length){txt("SALLY HAT DIR NOCH",80,62,5,G[0],"center");txt("KEINE TIPPS GEGEBEN.",80,71,5,G[0],"center");txt("B: ZURUECK",80,88,5,G[1],"center")}else{const start=Math.max(0,Math.min(sallyTipScroll,sallyTips.length-1));for(let i=0;i<3;i++){const idx=start+i;if(idx<sallyTips.length)txt((idx+1)+". "+sallyTips[idx],80,57+i*12,5,G[0],"center")}txt("TIPP "+(start+1)+"/"+sallyTips.length,80,94,5,G[1],"center");}txt("PFEILE: LESEN  B: ZURUECK",80,105,5,G[1],"center")}}
}
function title(){drawBG(frame*.2);rect(12,15,136,48,G[3]);rect(13,16,134,46,G[2]);txt("STICKY'S",80,30,12,G[0],'center');txt('RESCUE QUEST',80,43,10,G[0],'center');txt('EIN ABENTEUER BEGINNT',80,57,5,G[1],'center');txt('START GAME',80,91,8,G[0],'center');txt('A DRUECKEN',80,102,6,G[1],'center');txt('GAME BOY DMG PROTOTYP',80,134,5,G[1],'center')}
function reset(){landingSoundPending=false;pendingSylvie=false;sylvieHint=false;pauseScreen="main";pauseChoice=0;sallyTips=[];sallyTipScroll=0;worldLostLives=0;trapFailures={pit:0,widePit:0,spikes:0,other:0};toolPickup=false;sylvieShowHint=false;gameoverChoice=0;fallingIntoPit=false;player={x:18,y:95,vx:0,vy:0,w:9,h:12,on:false,face:1};spikeKnockback=null;pitSafeBySide=pits.map(()=>({left:null,right:null}));pitApproachIndex=-1;pitApproachSide='left';fallingPitKind='pit';fallingPitIndex=-1;fallingPitSide='left';cam=0;hasShears=false;shearsUsed=false;spikesActive=false;spikeHit=false;cartridge.taken=false;bush.cleared=false;sylvieMet=false;sylvieIntro=false;introPage=0;gameMessage='';messageTimer=0;score=0;lives=5;paused=false}
function showMessage(s,t=65){gameMessage=s;messageTimer=t}
// In diesem Prototyp ist die Cartridge der optionale Fundgegenstand. Die Gartenschere ist Pflichtwerkzeug.
function allLevelFindsCollected(){return cartridge.taken}
function nearBush(){return player.x+player.w>=bush.x-18&&player.x<=bush.x+bush.w+8}
function recordSallyTip(t){if(!t||sallyTips.includes(t))return;sallyTips.push(t);if(sallyTips.length>30)sallyTips.shift();sallyTipScroll=Math.max(0,sallyTips.length-3)}
function sallyTrapTip(trap){return trap==="widePit"?"GROSSE LUECKEN: A LAENGER HALTEN!":trap==="pit"?"SPRINGE MIT A UEBER DIE GRUBE!":trap==="spikes"?"SPRINGE MIT A UEBER DIE DORNEN!":"VERSUCHE ES MIT EINEM SPRUNG!"}

function advanceSylvie(){if(sylvieHint){sylvieHint=false;return}if(!sylvieIntro)return;introPage++;const pageCount=sylvieShowHint?5:4;if(introPage===4&&sylvieShowHint){recordSallyTip(sallyTrapTip(sylvieHelp))}if(introPage>=pageCount){sylvieIntro=false;sylvieMet=true;pendingSylvie=false;sylvieShowHint=false;showMessage('SALLY HILFT DIR!',55)}else{playSallyIntroPage()}}
function loseLife(message,respawnX,trapOverride,knockbackTargetX=null){landingSoundPending=false;lives=Math.max(0,lives-1);if(lives===0){scene='gameover';gameMessage='';messageTimer=0;pendingSylvie=false;spikeKnockback=null;return}fallingIntoPit=false;if(Number.isFinite(knockbackTargetX)){spikeKnockback={startX:player.x,targetX:Math.max(18,knockbackTargetX),elapsed:0,duration:12};player.vx=0;player.vy=0;player.on=false;player.face=spikeKnockback.targetX<player.x?-1:1;jumpQueued=false;gameMessage=message;messageTimer=0;}else{player.x=Math.max(18,respawnX);player.y=groundY-player.h;player.vy=0;player.on=true;}const trap=trapOverride||(message.includes('ABGRUND')?'pit':message.includes('DORNEN')?'spikes':'other');worldLostLives++;trapFailures[trap]++;if(!sylvieIntro&&worldLostLives>=1&&trapFailures[trap]<=2){pendingSylvie=true;sylvieShowHint=!sylvieMet;sylvieHelp=trap;}else{pendingSylvie=false}if(!Number.isFinite(knockbackTargetX))showMessage(message,75)}
function confirmGameoverChoice(){if(gameoverChoice===0){reset();scene='level';hint.textContent='Neustart: Level 1 · Pfeile bewegen · A springen · B Werkzeug'}else if(gameoverChoice===1){reset();scene='title';hint.textContent='Zurück zum Titelbildschirm'}else{const code=window.prompt('Level-Code eingeben (Prototyp-Testcode: WALD1):','');if(code===null)return;if(code.trim().toUpperCase()==='WALD1'||code.trim().toUpperCase()==='WALDLICHTUNG'){reset();scene='level';hint.textContent='Level-Code akzeptiert: WALDLICHTUNG'}else{hint.textContent='Code im Prototyp nicht erkannt. Testcode: WALD1';gameoverChoice=2}}}
function action(){
  if(scene==='exitchoice'){
    if(keys.b&&!allLevelFindsCollected()){
      scene='level';player.x=690;player.vx=0;hint.textContent='Du erkundest die Waldlichtung weiter. Der Ausgang bleibt geöffnet.';
    }else if(keys.a){scene='complete';hint.textContent='Level abgeschlossen!';}
    return;
  }
  if(scene==='title'){scene='level';return}
  if(scene==='complete'){reset();scene='title';return}
  if(sylvieIntro||sylvieHint){advanceSylvie();return}
  if(messageTimer>0){messageTimer=0;gameMessage='';toolPickup=false;if(pendingSylvie&&lives>0){pendingSylvie=false;if(sylvieMet){recordSallyTip(sallyTrapTip(sylvieHelp));sylvieHint=true;playSallyHint()}else{beginSallyIntro()}}return}
  if(paused){paused=false;return}
  if(!bush.cleared&&nearBush()){
    if(hasShears){playShearsSound();bush.cleared=true;shearsUsed=true;score+=5;showMessage('RANKEN ZERSCHNITTEN!',65);return;}
    showMessage('B DRUECKEN!',85);return;
  }
  if(bush.cleared&&sylvieMet&&player.x>700){scene='complete';return}
}
function inPitAt(px){const cx=px+player.w/2;return pits.find(q=>cx>q.x&&cx<q.x+q.w)||null}
function recordPitSafeGroundPosition(px){const center=px+player.w/2;pits.forEach((q,i)=>{const leftLimit=q.x-18-player.w/2;const rightLimit=q.x+q.w+18-player.w/2;if(center<q.x)pitSafeBySide[i].left=Math.min(px,leftLimit);else if(center>q.x+q.w)pitSafeBySide[i].right=Math.max(px,rightLimit)})}
function update(){
  frame++;
  if(scene==='title'||scene==='complete'||scene==='gameover'||scene==='exitchoice')return;
  // Sichtbarer, tatsaechlicher Rueckstoss von der Dornenfalle; waehrenddessen keine Eingabe.
  if(spikeKnockback){const k=spikeKnockback;k.elapsed++;const t=Math.min(1,k.elapsed/k.duration);const eased=1-(1-t)*(1-t);player.x=k.startX+(k.targetX-k.startX)*eased;player.y=groundY-player.h;player.vx=0;player.vy=0;player.on=t>=1;if(t>=1){spikeKnockback=null;showMessage('DORNEN! EIN LEBEN VERLOREN',75)}return;}
  if(messageTimer>0){messageTimer--;if(messageTimer===0){gameMessage='';toolPickup=false;if(pendingSylvie&&lives>0){pendingSylvie=false;if(sylvieMet){recordSallyTip(sallyTrapTip(sylvieHelp));sylvieHint=true}else{sylvieIntro=true;introPage=0}}}return;}
  if(sylvieIntro||sylvieHint||paused)return;
  if(bush.cleared&&player.x>=700&&!sylvieMet){beginSallyIntro();player.x=700;player.vx=0;return}
  const wasGrounded=player.on;if(wasGrounded&&!fallingIntoPit)recordPitSafeGroundPosition(player.x);
  let speed=keys.left?-1.25:keys.right?1.25:0;player.vx=speed;if(speed)player.face=speed>0?1:-1;
  if(jumpQueued&&player.on){player.vy=keys.up?-4.35:-4.15;player.on=false}jumpQueued=false;
  const oldX=player.x;let nextX=player.x+player.vx;
  // Solid bush collision: Sticky cannot walk through it before using the shears.
  if(!bush.cleared&&nextX+player.w>bush.x&&nextX<bush.x+bush.w){nextX=player.vx>0?bush.x-player.w:bush.x+bush.w}
  player.x=nextX;
  player.vy+=.215;if(player.vy>3.2)player.vy=3.2;player.y+=player.vy;
  // Pit edges have no floor. Walking into them causes a fall; jumping is required.
  let pit=inPitAt(player.x);
  const pitIndex=pit?pits.indexOf(pit):-1;
  // Anlaufseite sofort beim ersten Eintritt in die Grube anhand der Bewegungsrichtung festhalten – nicht erst bei Fallhöhe.
  if(pit&&!fallingIntoPit&&pitApproachIndex!==pitIndex){pitApproachIndex=pitIndex;pitApproachSide=player.vx>0?'left':player.vx<0?'right':((oldX+player.w/2)<pit.x?'left':'right')}
  if(pit&&player.y>=groundY-player.h&&player.vy>=0&&!fallingIntoPit){fallingIntoPit=true;fallingPitKind=pit.kind==='wide'?'widePit':'pit';fallingPitIndex=pitIndex;fallingPitSide=pitApproachIndex===pitIndex?pitApproachSide:(player.vx>0?'left':'right')}
  if(!pit&&!fallingIntoPit&&player.y>=groundY-player.h&&player.vy>=0){player.y=groundY-player.h;player.vy=0;player.on=true;if(landingSoundPending){playStickyLandingSound();landingSoundPending=false}}else player.on=false;
  // Pro Grube und Anlaufseite fortlaufend die letzte sichere Bodenposition speichern.
  if(!pit&&!fallingIntoPit&&player.on)recordPitSafeGroundPosition(player.x);
  if(!pit&&!fallingIntoPit)pitApproachIndex=-1;
  if(fallingIntoPit&&player.y>132){const trap=fallingPitKind;const q=pits[fallingPitIndex];const fallbackX=q?(fallingPitSide==='left'?q.x-18-player.w/2:q.x+q.w+18-player.w/2):18;const storedX=pitSafeBySide[fallingPitIndex]?.[fallingPitSide];const respawnX=Number.isFinite(storedX)?storedX:fallbackX;fallingIntoPit=false;fallingPitIndex=-1;pitApproachIndex=-1;loseLife('ABGRUND! EIN LEBEN VERLOREN',respawnX,trap);if(scene==='gameover')return}
  if(player.x>300&&!spikesActive&&player.x<340)spikesActive=true;
  const inSpikeZone=player.x+player.w>330&&player.x<348;
  if(spikesActive&&!spikeHit&&inSpikeZone&&player.on){spikeHit=true;const approachSide=player.vx>0?'left':player.vx<0?'right':(player.face>=0?'left':'right');const safeTarget=approachSide==='left'?330-player.w-18:348+18;loseLife('DORNEN! EIN LEBEN VERLOREN',safeTarget,'spikes',safeTarget);if(scene==='gameover'||spikeKnockback)return}
  if(!inSpikeZone)spikeHit=false;
  // Die Cartridge wird nur bei tatsächlicher Berührung eingesammelt; ein Sprung darüber ist möglich.
  if(!cartridge.taken&&player.x+player.w>cartridge.x&&player.x<cartridge.x+6&&player.y+player.h>cartridge.y&&player.y<cartridge.y+7){cartridge.taken=true;if(lives<5)lives++;else score+=100;showMessage('CARTRIDGE GEFUNDEN!',65)}
  if(!hasShears&&player.x>220&&player.x<250&&player.y<103){hasShears=true;score+=15;toolPickup=true;showMessage('GARTENSCHERE +15',100)}
  player.x=Math.max(0,Math.min(worldW-12,player.x));cam=Math.max(0,Math.min(worldW-160,player.x-65));
  // Am Ausgang wird nicht mehr automatisch gewechselt: erst die passende Entscheidung anzeigen.
  if(bush.cleared&&sylvieMet&&player.x>=700){player.x=700;player.vx=0;scene='exitchoice';}
}
function render(){ctx.clearRect(0,0,160,144);if(scene==='title')title();else if(scene==='level')drawLevel();else if(scene==='exitchoice'){drawLevel();rect(5,39,150,65,G[0]);rect(7,41,146,61,G[3]);if(allLevelFindsCollected()){txt('ALLES GEFUNDEN!',80,56,8,G[0],'center');txt('LEVEL VERLASSEN?',80,70,7,G[0],'center');txt('A: JA, WEITER',80,87,7,G[1],'center')}else{txt('HIER GIBT ES NOCH',80,53,7,G[0],'center');txt('ETWAS ZU ENTDECKEN!',80,63,7,G[0],'center');txt('A: LEVEL VERLASSEN',80,78,6,G[1],'center');txt('B: WEITER ERKUNDEN',80,90,6,G[1],'center')}}else if(scene==='gameover'){drawBG(0);rect(10,16,140,112,G[0]);rect(12,18,136,108,G[3]);txt('GAME OVER',80,32,12,G[0],'center');txt('ALLE LEBEN VERLOREN',80,43,5,G[0],'center');const opts=['NEU STARTEN','ZUM TITEL','LEVEL-CODE'];opts.forEach((v,i)=>{if(i===gameoverChoice)rect(25,54+i*17,110,13,G[1]);txt((i===gameoverChoice?'> ':'  ')+v,80,63+i*17,7,i===gameoverChoice?G[3]:G[0],'center')});txt('TESTCODE: WALD1',80,112,5,G[1],'center');txt('PFEILE + A/B',80,120,5,G[1],'center')}else{drawBG(0);rect(15,32,130,75,G[2]);txt('LEVEL GESCHAFFT!',80,53,10,G[0],'center');txt('WALDLICHTUNG',80,68,7,G[0],'center');txt('PROTOTYP ENDE',80,83,6,G[1],'center');txt('START: NEU STARTEN',80,99,5,G[0],'center')}}
function loop(){update();render();requestAnimationFrame(loop)}
function press(k,on){if(on&&!keys[k]&&scene==='exitchoice'&&(k==='a'||k==='b')){if(k==='a'||(k==='b'&&!allLevelFindsCollected())){keys[k]=true;action();keys[k]=false;}return}if(on&&!keys[k]&&scene==='gameover'&&(k==='up'||k==='down')){gameoverChoice=(gameoverChoice+(k==='down'?1:2))%3;}if(on&&!keys[k]&&k==='a'&&scene==='level'&&!paused&&!sylvieIntro&&!sylvieHint&&messageTimer===0&&player.on){jumpQueued=true;landingSoundPending=true;playJumpSound();}keys[k]=on;const el=document.querySelector(`[data-key="${k}"]`);if(el)el.classList.toggle('down',on);if(!on)return;if(k==='start'){if(scene==='title')action();else if(scene==='complete')action();else if(scene==='gameover')confirmGameoverChoice();else if(!sylvieIntro&&!sylvieHint){if(!paused){paused=true;pauseScreen="main";pauseChoice=0}else if(pauseScreen!=="main"){pauseScreen="main"}else paused=false;}return}if((k==='a'||k==='b')&&scene==='title'){action();return}if(paused&&pauseScreen==="main"&&(k==="up"||k==="down")){const menuCount=sylvieMet?3:2;pauseChoice=(pauseChoice+(k==="down"?1:menuCount-1))%menuCount;return}if(paused&&pauseScreen==="tips"&&(k==="up"||k==="down")){if(sallyTips.length){sallyTipScroll=Math.max(0,Math.min(Math.max(0,sallyTips.length-3),sallyTipScroll+(k==="down"?1:-1)))}return}if((k==='a'||k==='b')&&paused){if(pauseScreen==="main"){if(k==="b"){paused=false;return}if(pauseChoice===0){paused=false;return}if(pauseChoice===1){pauseScreen="controls";return}if(pauseChoice===2&&sylvieMet){pauseScreen="tips";sallyTipScroll=Math.max(0,sallyTips.length-3);return}}else{if(k==="b"){pauseScreen="main";return}return}}if((k==='a'||k==='b')&&scene==='level'){if(sylvieIntro||sylvieHint||messageTimer>0||paused||k==='b')action()}if((k==='a'||k==='b')&&scene==='gameover')confirmGameoverChoice()}
  document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);press(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();press(k,false)}))});
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'a',KeyB:'b',Enter:'start',Space:'a'};
  window.addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();if(!keys[map[e.code]])press(map[e.code],true)}});
  window.addEventListener('keyup',e=>{if(map[e.code])press(map[e.code],false)});
  loop();
})();
</script>
