  <rect x="6" y="5" width="4" height="7"/><rect x="7" y="4" width="2" height="1"/>
  <rect x="12" y="5" width="4" height="7"/><rect x="13" y="4" width="2" height="1"/>
  <rect x="18" y="5" width="4" height="7"/><rect x="19" y="4" width="2" height="1"/>
  <rect x="24" y="5" width="4" height="7"/><rect x="25" y="4" width="2" height="1"/>
  <rect x="30" y="5" width="4" height="7"/><rect x="31" y="4" width="2" height="1"/>
</g>
<g fill="#f4f4f4">
  <rect x="7" y="6" width="2" height="4"/><rect x="13" y="6" width="2" height="4"/>
  <rect x="19" y="6" width="2" height="4"/><rect x="25" y="6" width="2" height="4"/>
  <rect x="31" y="6" width="2" height="4"/>
</g>
