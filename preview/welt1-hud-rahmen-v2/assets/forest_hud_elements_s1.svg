<svg xmlns="http://www.w3.org/2000/svg" width="160" height="16" viewBox="0 0 160 16" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
<title id="title">HUD-Anzeigen – W1L08 Sturm</title>
<desc id="desc">Verkleinerte fünf Cartridge-Symbole und ein zentriertes Fragezeichen mit mindestens einem Pixel Abstand zu HUD-Rahmen und Trennern; Levelkennung und Punktestand bleiben wie in der vorhandenen Referenz.</desc>
<!-- Five reduced life cartridges. Each is 4×8 px with clear space around the group. -->
